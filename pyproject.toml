[project]
name = "steward"
version = "0.1.0"
description = "Steward — an autonomous open-source maintainer's teammate (triage, reproduce, fix via draft PRs, behind a trust policy)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.40,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # Stateful orchestration graph with checkpointing + HITL interrupts (ADR-0001).
    "langgraph>=0.2,<1",
    # The Steward MCP server: exposes Steward's capabilities as MCP tools (§2/§14).
    "fastmcp>=2.0,<3",
]

[project.optional-dependencies]
# Voyage AI embeddings for duplicate-issue detection (steward.triage.dedup).
# Optional so default installs / CI stay light — the dedup code paths are unit
# tested against an injected stub. Enable live with `uv sync --extra dedup`.
dedup = ["voyageai>=0.3,<1"]
# Observability backend. Optional on purpose: tracing degrades to a no-op when
# this is not installed (or keys are absent), so local dev and CI never depend
# on Langfuse. Pinned to the v2 client API the Langfuse sink targets.
observability = ["langfuse>=2.0,<3"]
# Docker SDK for live sandboxed test runs (steward.sandbox.docker_backend).
# Optional so default installs / CI stay light — the runner is unit-tested
# against an injected fake backend, and the Docker import is lazy. Enable live
# with `uv sync --extra sandbox`.
sandbox = ["docker>=7,<8"]

[dependency-groups]
# Dev tooling. uv installs this group by default (`uv sync`).
dev = [
    "ruff>=0.5.0,<1",
    "pyright>=1.1.370,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    # ASGI test client for the FastAPI service (starlette TestClient needs it).
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-ish default set; expand per-milestone as needed.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
